# Lab KamaPay : API de portefeuille derrière un proxy TLS, base PostgreSQL isolée.
# Démarrage : make lab-up (génère d'abord les secrets et le certificat).
name: kamapay-lab

x-hardening: &hardening
  read_only: true
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  proxy:
    <<: *hardening
    image: nginx:1.27-alpine
    user: "101:101"
    ports:
      - "127.0.0.1:8443:8443"   # seul point d'entrée exposé (contrôle 8.20)
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/certs:/etc/nginx/certs:ro
    tmpfs: [/tmp]
    networks: [frontend]
    depends_on:
      api: {condition: service_healthy}

  api:
    <<: *hardening
    build: ./api
    image: kamapay-lab-api:latest
    environment:
      DATABASE_URL: postgresql://kamapay_app:${APP_DB_PASSWORD}@db:5432/kamapay
      API_SECRET_KEY: ${API_SECRET_KEY}
    tmpfs: [/tmp]
    networks: [frontend, backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      retries: 20
    depends_on:
      db: {condition: service_healthy}

  db:
    <<: *hardening
    image: postgres:16-alpine
    user: "70:70"
    environment:
      POSTGRES_DB: kamapay
      POSTGRES_USER: kamapay_admin
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    tmpfs: [/tmp, /var/run/postgresql]
    networks: [backend]        # aucun port publié (contrôle 8.22)
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kamapay_admin", "-d", "kamapay"]
      interval: 5s
      retries: 20

networks:
  frontend: {}
  backend:
    internal: true             # pas de route vers l'extérieur

volumes:
  db-data: {}
